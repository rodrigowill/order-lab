name: order-app
services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres_db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: order
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["npx", "prisma", "migrate", "deploy", "--config", "prisma7.config.ts"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/order
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: orderlab
      RABBITMQ_DEFAULT_PASS: orderlab
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    restart: always

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: order_api
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/order
      RABBITMQ_URL: amqp://orderlab:orderlab@rabbitmq:5672
      PORT: 3000
      OTEL_SERVICE_NAME: order-lab-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    command: node dist/main.js
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      jaeger:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: order_worker
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/order
      RABBITMQ_URL: amqp://orderlab:orderlab@rabbitmq:5672
      OTEL_SERVICE_NAME: order-lab-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    command: node dist/worker/worker.main.js
    depends_on: 
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      jaeger:
        condition: service_started

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args: 
        VITE_API_URL: http://localhost:3000
    container_name: order_web
    restart: always
    ports:
      - "80:80"

volumes:
  postgres_data: